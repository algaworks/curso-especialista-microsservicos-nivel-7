server.port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/notifications
    username: postgres
    password: postgres
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/testdata
  mail:
    host: localhost
    port: 1025
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.algashop.local:8081

algashop:
  notifications:
    mail:
      from: no-reply@algashop.local